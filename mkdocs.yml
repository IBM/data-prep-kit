site_name: "Data-Prep-Kit"
docs_dir: .
site_dir: ../site
repo_url: https://github.com/data-prep-kit/data-prep-kit
nav:
    - Home: README.md
    - Overview: data-processing-lib/doc/overview.md
    - Tutorials:
          - QuickStart: doc/quick-start/quick-start.md
          - Developer Tutorial: doc/quick-start/contribute-your-own-transform.md
          - Run Virtual: doc/quick-start/run-transform-venv.md
          - Run Image: doc/quick-start/run-transform-image.md
          - Advanced: ADVANCED.md
          - Windows Support: doc/quick-start/quick-start.md#running-transforms-on-windows
          - KFP Pipeline: kfp/doc/simple_transform_pipeline.md
    - Quick Links:
          - How to Contribute: CONTRIBUTING.md
          - Learn about DPK: resources.md
theme:
    name: "material"
    palette:
        primary: black
    #  palette:
    #    primary: 'blue grey'
    features:
        - navigation.tabs
plugins:
    - search
    - mkdocstrings
    - badges
    - same-dir
markdown_extensions:
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
hooks:
    - .github/mkdocs_hook.py
